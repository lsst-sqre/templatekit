[tox]
envlist = py,coverage-report,typing,lint
isolated_build = True

[testenv]
description = Run pytest against {envname}.
commands =
    pytest --cov=templatekit --cov-branch --cov-report= {posargs}
extras =
    dev

[testenv:coverage-report]
description = Compile coverage from each test run.
skip_install = true
deps = coverage[toml]>=5.0.2
depends =
    py
commands = coverage report

[testenv:typing]
description = Run mypy.
commands =
    mypy src/templatekit tests

[testenv:lint]
description = Lint codebase by running pre-commit (ruff).
skip_install = true
deps =
    pre-commit
commands = pre-commit run --all-files

[testenv:docs]
description = Build documentation (HTML) with Sphinx.
dependency_groups = docs
commands =
    sphinx-build -W --keep-going -n -T -b html -d {envtmpdir}/doctrees docs docs/_build/html
pass_env = OOK_TOKEN, GITHUB_*, ACTIONS_ID_TOKEN_REQUEST_*

[testenv:docs-linkcheck]
description = Check links in the documentation.
dependency_groups = docs
pass_env = OOK_TOKEN, GITHUB_*, ACTIONS_ID_TOKEN_REQUEST_*
commands =
    sphinx-build -W --keep-going -n -T -b linkcheck -d {envtmpdir}/doctrees docs docs/_build/linkcheck
